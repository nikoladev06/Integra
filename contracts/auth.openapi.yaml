openapi: 3.1.0

info:
  title: Integra — auth-service
  version: 2.0.0
  description: |
    Identidade e sessão. Emite e renova JWT, e permite a troca de senha por um
    usuário autenticado.

    **Fora do escopo:** não há recuperação de senha por e-mail. Este serviço não
    emite token de reset e não envia e-mail. Quem esqueceu a senha não tem, hoje,
    caminho de autoatendimento.

    As regras de validação abaixo são as mesmas de
    `app/lib/features/auth/domain/auth_validators.dart`. As mensagens devem ser
    idênticas nos dois lados: o cliente valida para dar retorno imediato, o
    serviço valida porque é a única validação que vale.

servers:
  - url: https://api.integra.app
    description: produção (Oracle Cloud, atrás do Traefik)
  - url: http://localhost:8080
    description: desenvolvimento local (gateway do docker compose)

tags:
  - name: sessão
    description: cadastro, login e ciclo de vida do token
  - name: senha
    description: troca de senha do usuário autenticado

paths:
  /auth/register:
    post:
      tags: [sessão]
      summary: Cadastra um novo aluno
      operationId: register
      description: |
        Cria a credencial e o perfil correspondente no `user-service` na mesma
        transação lógica. Um e-mail ou username já em uso responde `409`, não `422`
        — o cliente precisa distinguir "formato inválido" de "já existe" para
        escolher a mensagem.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterRequest' }
      responses:
        '201':
          description: Cadastro criado. Não faz login automático — o cliente redireciona para o login.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RegisterResponse' }
        '409':
          description: E-mail, username ou CPF já cadastrado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                emailEmUso:
                  value: { code: email_ja_cadastrado, message: 'Email já cadastrado' }
                usernameEmUso:
                  value: { code: username_ja_existe, message: 'Username já existe' }
                cpfEmUso:
                  value: { code: cpf_ja_cadastrado, message: 'CPF já cadastrado' }
        '422':
          $ref: '#/components/responses/ValidationError'

  /auth/register/instituicao:
    post:
      tags: [sessão]
      summary: Cadastra uma faculdade ou empresa
      operationId: registerInstituicao
      description: |
        Uma rota, duas telas: o cliente tem um formulário para faculdade e outro
        para empresa, e os dois postam aqui com `tipo` diferente.

        **A conta nasce pendente.** Ela entra, edita o perfil e vê a própria
        página, mas não publica nem matricula até ser ativada — o cliente lê
        `ativadaEm` em `GET /users/me` e mostra o aviso de análise enquanto for
        nulo.

        O motivo: CNPJ é dado **público**, está no cadastro aberto da Receita.
        O número identifica a organização e não prova que quem digitou a
        representa. Sem o estado pendente, consultar o CNPJ de uma faculdade
        bastaria para distribuir formações "verificadas" no nome dela — e o selo,
        que é a peça central do modelo, deixaria de significar algo.

        Para `faculdade`, o CNPJ também decide a identidade da instituição:
        casando com uma universidade já catalogada e sem conta, a conta
        **reivindica** aquela linha — a mesma que alunos já seguem e declararam.
        Casando com uma já administrada, responde `409`. Sem correspondência, uma
        universidade nova é criada.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterInstituicaoRequest' }
      responses:
        '201':
          description: Conta criada, pendente de ativação. Não faz login automático.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RegisterResponse' }
        '409':
          description: E-mail, username ou CNPJ já cadastrado, ou instituição já administrada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                cnpjEmUso:
                  value: { code: cnpj_ja_cadastrado, message: 'CNPJ já cadastrado' }
                jaAdministrada:
                  value:
                    code: universidade_ja_administrada
                    message: 'Esta instituição já tem uma conta cadastrada'
        '422':
          $ref: '#/components/responses/ValidationError'

  /auth/login:
    post:
      tags: [sessão]
      summary: Autentica e emite o par de tokens
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Autenticado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenPair' }
        '401':
          description: |
            Credenciais inválidas. A mensagem é deliberadamente genérica e idêntica
            para e-mail inexistente e senha errada — distinguir os dois entrega ao
            atacante uma sonda de quais e-mails existem na base.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { code: credenciais_invalidas, message: 'E-mail ou senha incorretos' }
        '422':
          $ref: '#/components/responses/ValidationError'

  /auth/refresh:
    post:
      tags: [sessão]
      summary: Troca um refresh token por um novo par
      operationId: refresh
      description: |
        Rotação de refresh token: o token apresentado é revogado e um novo é
        emitido. Reapresentar um refresh já usado responde `401` e revoga toda a
        família de tokens daquela sessão — é o sinal de que o token vazou.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken: { type: string }
      responses:
        '200':
          description: Novo par emitido
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenPair' }
        '401':
          description: Refresh token inválido, expirado ou já utilizado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /auth/logout:
    post:
      tags: [sessão]
      summary: Revoga o refresh token da sessão atual
      operationId: logout
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken: { type: string }
      responses:
        '204':
          description: |
            Sessão encerrada. Responde `204` mesmo se o token já era inválido —
            logout é idempotente e o cliente não tem o que fazer com um erro aqui.

  /auth/password:
    put:
      tags: [senha]
      summary: Troca a senha do usuário autenticado
      operationId: changePassword
      description: |
        Único caminho de mudança de senha no sistema. Exige a senha atual, o que
        impede que um token roubado sozinho baste para sequestrar a conta.

        Regras em `app/lib/features/profile/domain/password_change_validator.dart`.
        Trocar a senha revoga todos os refresh tokens do usuário, inclusive o da
        sessão que fez a troca — o cliente precisa refazer o login.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChangePasswordRequest' }
      responses:
        '204':
          description: Senha alterada; todas as sessões foram revogadas
        '401':
          description: Senha atual incorreta
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { code: senha_atual_incorreta, message: 'Senha atual está incorreta' }
        '422':
          $ref: '#/components/responses/ValidationError'

  /health:
    get:
      tags: [sessão]
      summary: Liveness e readiness
      operationId: health
      security: []
      responses:
        '200':
          description: Serviço no ar e com o banco alcançável
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }
        '503':
          description: Serviço no ar mas com dependência indisponível
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    RegisterRequest:
      type: object
      required: [nomeCompleto, email, username, senha, telefone, cpf]
      description: |
        `universidadeId` e `cursoId` são **opcionais** desde a v2: declarar
        formação é cosmético e não concede acesso a nada. Quem os informa ganha
        uma linha no currículo, não um vínculo — o vínculo nasce no
        `user-service`, quando o aluno informa o CPF no perfil da instituição.
      properties:
        nomeCompleto:
          type: string
          description: Pelo menos dois nomes separados por espaço.
          examples: ['Ana Paula Souza']
        email:
          type: string
          format: email
          description: Normalizado para minúsculas antes de gravar.
          examples: ['ana@fatec.sp.gov.br']
        username:
          type: string
          minLength: 3
          pattern: '^[a-zA-Z0-9_]+$'
          description: Normalizado para minúsculas. Único na base.
          examples: ['ana_souza']
        senha:
          type: string
          minLength: 6
          format: password
        telefone:
          type: string
          pattern: '^\(?\d{2}\)?[\s-]?\d{4,5}-?\d{4}$'
          examples: ['(16)99999-9999']
        cpf:
          type: string
          description: |
            Obrigatório e **único por conta**. Com ou sem pontuação; normalizado
            para dígitos e validado pelos dígitos verificadores — o que recusa
            valor digitado errado, não identidade.

            É a chave que liga a conta às matrículas que as faculdades cadastram.
            Por isso não é editável depois: trocar o próprio CPF pelo de outra
            pessoa permitiria assumir a matrícula dela.
          examples: ['123.456.789-00']
        universidadeId:
          type: string
          format: uuid
          description: |
            Opcional. De `GET /universidades`. Informado junto com `cursoId`,
            cria uma formação **declarada** — sem verificação, como no LinkedIn.
        cursoId:
          type: string
          format: uuid
          description: |
            Opcional, e obrigatório se `universidadeId` vier. De
            `GET /universidades/{id}/cursos` — os cursos que a própria
            instituição cadastrou.

    RegisterInstituicaoRequest:
      type: object
      required: [tipo, nome, cnpj, email, username, senha, telefone]
      description: |
        Sem CPF e sem formação: organização não estuda em lugar nenhum, e CPF é de
        pessoa. Uma conta nunca tem CPF e CNPJ ao mesmo tempo — o banco recusa.
      properties:
        tipo:
          type: string
          enum: [faculdade, empresa]
          description: '`aluno` não é aceito aqui; use `POST /auth/register`.'
        nome:
          type: string
          maxLength: 200
          description: Nome da instituição, como aparecerá no perfil.
          examples: ['Faculdade de Tecnologia de Ribeirão Preto']
        cnpj:
          type: string
          description: |
            Com ou sem pontuação; normalizado para dígitos e validado pelos
            dígitos verificadores. Único por conta.
          examples: ['12.345.678/0001-95']
        sigla:
          type: string
          maxLength: 20
          description: |
            Opcional, e só usada quando o CNPJ não corresponde a nenhuma
            universidade catalogada e uma nova é criada. Ausente, as iniciais do
            nome servem de rótulo curto até a instituição editar o perfil.
          examples: ['FATEC RP']
        email: { type: string, format: email }
        username: { type: string, minLength: 3, pattern: '^[a-zA-Z0-9_]+$' }
        senha: { type: string, minLength: 6, format: password }
        telefone: { type: string, pattern: '^\(?\d{2}\)?[\s-]?\d{4,5}-?\d{4}$' }

    RegisterResponse:
      type: object
      required: [userId]
      properties:
        userId: { type: string, format: uuid }

    LoginRequest:
      type: object
      required: [email, senha]
      properties:
        email: { type: string, format: email }
        senha: { type: string, format: password }

    ChangePasswordRequest:
      type: object
      required: [senhaAtual, novaSenha, confirmacao]
      properties:
        senhaAtual: { type: string, format: password }
        novaSenha:
          type: string
          minLength: 6
          format: password
          description: Precisa ser diferente da senha atual.
        confirmacao:
          type: string
          format: password
          description: Precisa ser idêntica a `novaSenha`.

    TokenPair:
      type: object
      required: [accessToken, refreshToken, tokenType, expiresIn]
      properties:
        accessToken:
          type: string
          description: |
            JWT assinado em HS256, validado localmente pelos outros serviços sem
            chamada de rede ao auth-service.

            Claims: `sub` (userId), `tipo` (aluno|faculdade|empresa), `exp`,
            `iat`, e o **vínculo ativo** em `vinculoUniversidadeId` e
            `vinculoCursoId` — **nulos quando não há vínculo**, que é o estado de
            toda conta recém-criada.

            Os nomes trazem `vinculo` de propósito: até a v1 eram
            `universidadeId`/`cursoId` e significavam a afiliação declarada, que
            agora não concede nada. Nomes iguais com semântica trocada seriam a
            forma mais fácil de um serviço conceder acesso pela formação que o
            usuário digitou sozinho.

            Formação declarada **não** entra no token: ela é cosmética, e o que
            não decide autorização não precisa viajar em toda requisição.
        refreshToken:
          type: string
          description: Opaco, guardado no servidor. Não é JWT.
        tokenType: { type: string, const: Bearer }
        expiresIn:
          type: integer
          description: Segundos até o access token expirar.
          examples: [900]

    Health:
      type: object
      required: [status, service]
      properties:
        status: { type: string, enum: [ok, degraded] }
        service: { type: string, examples: ['auth-service'] }
        version: { type: string }
        dependencies:
          type: object
          additionalProperties: { type: string, enum: [ok, unreachable] }
          examples: [{ database: ok }]

    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: Identificador estável para o cliente ramificar. Nunca traduzir.
          examples: ['validation_error']
        message:
          type: string
          description: Mensagem em português, exibível ao usuário.
        fields:
          type: object
          description: Erros por campo, quando `code` é `validation_error`.
          additionalProperties:
            type: array
            items: { type: string }

  responses:
    ValidationError:
      description: |
        Falha de validação. As mensagens em `fields` são exatamente as de
        `auth_validators.dart` — o cliente pode exibi-las sem traduzir.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            code: validation_error
            message: 'Verifique os campos destacados'
            fields:
              email: ['Insira um e-mail válido (ex: usuario@exemplo.com)']
              senha: ['Senha deve ter no mínimo 6 caracteres']
              nomeCompleto: ['Nome completo deve ter pelo menos 2 nomes']
              cpf: ['CPF inválido']

security:
  - bearerAuth: []
