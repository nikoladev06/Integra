# - post restrito a MAIS DE UM curso, ou só um?
# - faculdade edita post publicado, ou só apaga?
# - um post `publico` aparece para quem NAO segue a universidade? (busca,
#   descoberta) Hoje o escopo do feed diz que não; falta decidir se existe
#   alguma tela de descoberta onde ele apareça.
