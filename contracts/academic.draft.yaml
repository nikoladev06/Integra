openapi: 3.1.0
info:
  title: Integra — academic-service (RASCUNHO)
  version: 0.3.0-draft
  description: |
    Posts institucionais publicados por contas `faculdade`, com três níveis de
    visibilidade, e curtidas e comentários de quem pode vê-los.

    REGRA DE SEGURANÇA CENTRAL — quem concede acesso é o VÍNCULO, e só ele.

      vinculo ATIVO com a universidade   publico        ve
                                         institucional  ve
                                         curso == o do  ve
                                           vinculo
                                         outro curso    NAO ve

      segue, sem vinculo                 publico        ve
                                         institucional  NAO ve
                                         curso          NAO ve

      nem segue nem tem vinculo          publico        ve (pelo perfil da
                                                            instituicao ou por
                                                            recomendacao)
                                         o resto        NAO ve

    TRES COISAS QUE NAO CONCEDEM NADA, e que é fácil confundir com quem concede:

    1. **Formação declarada.** O usuário digita a faculdade que quiser, sem
       verificação. É cosmético.
    2. **Formação verificada sem vínculo ativo.** Quem se formou, ou foi removido
       pela instituição, mantém o selo e volta a ver apenas os públicos. O selo é
       currículo, não credencial de acesso.
    3. **Seguir.** Coloca a instituição no feed; não abre o conteúdo interno.

    Na v0.2 o acesso vinha da afiliação informada no cadastro — isto é, do que o
    próprio usuário digitava. Era o modelo errado: bastava declarar uma faculdade
    para ler os comunicados internos dela.

    A visibilidade é resolvida NO SERVIÇO, na consulta, a partir do claim
    `vinculoUniversidadeId`/`vinculoCursoId` do token. O cliente nunca recebe um
    post que não deveria ver e depois filtra — isso transformaria a regra numa
    decoração de UI, contornável por quem ler a resposta da API.

paths:
  /academic/posts:
    get:
      summary: Feed institucional do aluno autenticado
      description: |
        O parâmetro `escopo` corresponde ao seletor no topo da tela:

          geral  (padrão)  a universidade do vínculo + todas as seguidas
          minha            só a universidade do vínculo ativo

        Sem vínculo, `minha` responde lista vazia — não é erro, é o estado de
        quem ainda não informou o CPF em nenhuma instituição. A tela mostra o
        caminho: buscar a faculdade e inserir o CPF.

        `escopo` escolhe QUAIS universidades entram, nunca QUAL conteúdo: a
        matriz de visibilidade acima vale igual nos dois casos. Não existe
        parâmetro de universidade arbitrária — o conjunto sai do vínculo e da
        lista de seguidas, e não do que o cliente pedir.
      parameters:
        - name: escopo
          in: query
          schema: { type: string, enum: [geral, minha], default: geral }
        - name: limit
          in: query
          schema: { type: integer, default: 20, maximum: 50 }
        - name: cursor
          in: query
          schema: { type: string }
    post:
      summary: Publica um post institucional
      description: |
        Exige `tipo == faculdade` no token; aluno recebe 403. A universidade do
        post é a do autor — não é um campo do corpo.

        `cursoId` é obrigatório quando `visibilidade == curso`, e precisa ser um
        curso desta instituição.

        `visibilidade` é obrigatória e SEM valor padrão no servidor: o formulário
        do cliente pré-seleciona `institucional`, mas o serviço não adivinha.
        Um default do lado do servidor faria uma chamada malformada publicar com
        alcance que ninguém escolheu.
  /academic/posts/{postId}:
    get: { summary: Detalhe de um post, sujeito à mesma matriz de visibilidade }
    delete: { summary: Remove um post (só a faculdade autora) }
  /academic/posts/{postId}/curtidas:
    put: { summary: Curte (idempotente) }
    delete: { summary: Descurte }
  /academic/posts/{postId}/comentarios:
    get: { summary: Lista comentários }
    post:
      summary: Comenta
      description: |
        Só quem pode VER o post pode comentar. Vale dizer explícito porque é o
        erro clássico: checar visibilidade na leitura e esquecer na escrita.

components:
  schemas:
    Visibilidade:
      type: string
      enum: [publico, institucional, curso]
      description: |
        publico        qualquer usuário autenticado
        institucional  apenas quem tem VÍNCULO ATIVO com esta universidade
        curso          apenas quem tem vínculo ativo NESTE curso dela

