name: CI

on:
  push:
  pull_request:

jobs:
  app:
    name: Flutter (analyze + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true

      - run: flutter pub get

      # Os arquivos .freezed.dart e .g.dart são versionados, para a CI não
      # precisar de passo de geração e para o clone já compilar. O risco disso é
      # commitar código gerado desatualizado: alguém edita um modelo e esquece
      # de rodar o build_runner. Regenerar e exigir árvore limpa fecha a brecha.
      - run: dart run build_runner build
      - name: Código gerado está atualizado?
        run: |
          if ! git diff --exit-code --stat; then
            echo "::error::Código gerado desatualizado. Rode 'dart run build_runner build' em app/ e commite o resultado."
            exit 1
          fi

      - run: flutter analyze

      - run: flutter test

  services:
    name: Python (ruff + pytest + contratos)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services

    # Postgres de verdade, não SQLite. O projeto usa schemas, pg_trgm, ON CONFLICT
    # e o tipo UUID nativo — nada disso existe no SQLite, e um teste que passa
    # contra outro banco testa outra coisa.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: integra
          POSTGRES_PASSWORD: integra
          POSTGRES_DB: integra
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U integra -d integra"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      INTEGRA_TEST_DATABASE_URL: postgresql+asyncpg://integra:integra@127.0.0.1:5432/integra
      INTEGRA_DATABASE_URL: postgresql+asyncpg://integra:integra@127.0.0.1:5432/integra
      INTEGRA_JWT_SECRET: segredo-de-ci-com-mais-de-32-caracteres
      INTEGRA_SERVICO_TOKEN: token-de-servico-de-ci-com-32-chars

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          version: '0.11.9'
          enable-cache: true

      # --frozen: a CI usa exatamente o uv.lock versionado. Sem isso ela
      # resolveria versões novas por conta própria e passaria — ou quebraria —
      # com um conjunto de dependências que ninguém tem na máquina.
      - run: uv sync --all-packages --frozen

      - run: uv run ruff check .

      - run: uv run ruff format --check .

      # As migrações constroem o schema que os testes de integração usam. Rodar
      # aqui também prova que elas aplicam numa base vazia — o caminho que a VM
      # percorre no deploy, e que ninguém exercita rodando local.
      - name: Migrações e seed
        run: |
          (cd user && uv run --project .. alembic upgrade head)
          (cd auth && uv run --project .. alembic upgrade head)
          (cd user && uv run --project .. python -m user_service.seed)

      # Guarda de deriva do schema: falha se algum modelo mudou sem migração
      # correspondente. É o equivalente, no banco, do guarda de contrato — sem
      # ele o modelo e o schema divergem em silêncio até quebrar em produção.
      - name: Migrações cobrem os modelos?
        run: |
          (cd user && uv run --project .. alembic check)
          (cd auth && uv run --project .. alembic check)

      # Inclui test_contratos.py, que falha se algum serviço expuser rota fora
      # de contracts/.
      - run: uv run pytest -q
