[project]
name = "integra-feed"
version = "0.1.0"
description = "Integra — feed-service"
requires-python = ">=3.12"
dependencies = [
    "integra-shared",
    "uvicorn[standard]>=0.32",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/feed_service"]
