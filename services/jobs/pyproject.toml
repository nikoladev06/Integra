[project]
name = "integra-jobs"
version = "0.1.0"
description = "Integra — jobs-service"
requires-python = ">=3.12"
dependencies = [
    "integra-shared",
    "uvicorn[standard]>=0.32",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jobs_service"]
