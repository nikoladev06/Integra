[project]
name = "integra-shared"
version = "0.1.0"
description = "Peças comuns a todos os microsserviços Integra: config, erros, JWT, health, paginação, chamadas internas e URLs de upload."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pyjwt>=2.10",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "argon2-cffi>=23.1",
    "httpx>=0.28",
    # Só para ASSINAR URLs de upload (`armazenamento.py`), que é HMAC local e não
    # chama o storage. Escrever SigV4 à mão seria ~60 linhas de código de
    # assinatura — e é a última coisa que se quer escrever à mão.
    "boto3>=1.35",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/integra_shared"]
