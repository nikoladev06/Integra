# Stack de desenvolvimento local: Traefik + Postgres + os serviços do núcleo.
# Sem TLS aqui — a camada de certificado entra em docker-compose.prod.yml, para
# que rodar local não dependa de domínio nem de e-mail de ACME.
#
#   cd infra && cp .env.example .env && docker compose up --build
#
# Depois disso:
#   http://localhost:8080/health/auth
#   http://localhost:8080/health/user
#   http://localhost:8080/health/academic
#   http://localhost:8080/health/feed
#   http://localhost:8080/health/jobs
#   http://localhost:8081            painel do Traefik (só local)
#   http://localhost:9001            console do MinIO (só local)

name: integra

services:
  traefik:
    image: traefik:v3.7  # v3.3 nao fala a API do Docker Engine 29 (min 1.40)
    restart: unless-stopped
    command:
      - --providers.docker=true
      # Nada é roteado sem label explícita: um contêiner novo não vaza para a
      # internet só por subir na mesma rede.
      - --providers.docker.exposedByDefault=false
      # Sem isto o Traefik escolhe ARBITRARIAMENTE uma das redes do contêiner
      # para alcançá-lo. Como auth e user estão em `borda` e `interna`, e o
      # Traefik só está em `borda`, a escolha errada rende 504 em silêncio — e
      # muda entre reinícios, então funciona até não funcionar.
      - --providers.docker.network=integra_borda
      - --entrypoints.web.address=:80
      - --api.dashboard=true
      - --api.insecure=true # SÓ local; o overlay de produção remove
      - --accesslog=true
    ports:
      - "8080:80"
      - "8081:8080"
    volumes:
      # Somente leitura: o Traefik precisa observar eventos do Docker, não emitir.
      # Montar o socket com escrita dá controle do host a quem comprometer o proxy.
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [borda]

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      # Ligado a 127.0.0.1, não a 0.0.0.0. A diferença é o que importa: em
      # loopback só processos da própria máquina alcançam o banco, o que dá
      # psql, alembic e testes de integração a partir do host sem abrir o
      # Postgres para a rede. `0.0.0.0:5432` seria o caminho conhecido de uma
      # instância de desenvolvimento acabar acessível pela internet.
      - "127.0.0.1:55432:5432"
    networks: [interna]

  auth:
    build:
      context: ../services
      args:
        SERVICO: auth
    restart: unless-stopped
    environment:
      INTEGRA_AMBIENTE: ${INTEGRA_AMBIENTE:-local}
      INTEGRA_JWT_SECRET: ${INTEGRA_JWT_SECRET}
      INTEGRA_SERVICO_TOKEN: ${INTEGRA_SERVICO_TOKEN}
      # Nome do serviço, não o gateway: a chamada interna vai direto pela rede do
      # compose. Passar pelo Traefik daria uma volta pela borda sem nenhum ganho.
      INTEGRA_USER_SERVICE_URL: http://user:8000
      INTEGRA_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    depends_on:
      postgres:
        condition: service_healthy
      user:
        condition: service_started
    labels:
      - traefik.enable=true
      - traefik.http.services.auth.loadbalancer.server.port=8000
      - traefik.http.routers.auth.rule=PathPrefix(`/auth`)
      - traefik.http.routers.auth.entrypoints=web
      # Os dois serviços expõem `/health` no mesmo caminho, então o gateway
      # precisa desambiguar. `replacePath` mantém o contrato honesto: dentro do
      # serviço o caminho continua sendo `/health`, como os contratos declaram.
      - traefik.http.routers.auth-health.rule=Path(`/health/auth`)
      - traefik.http.routers.auth-health.entrypoints=web
      - traefik.http.routers.auth-health.middlewares=auth-health-path
      - traefik.http.routers.auth-health.service=auth
      - traefik.http.middlewares.auth-health-path.replacepath.path=/health
    networks: [borda, interna]

  user:
    build:
      context: ../services
      args:
        SERVICO: user
    restart: unless-stopped
    environment:
      INTEGRA_AMBIENTE: ${INTEGRA_AMBIENTE:-local}
      INTEGRA_JWT_SECRET: ${INTEGRA_JWT_SECRET}
      INTEGRA_SERVICO_TOKEN: ${INTEGRA_SERVICO_TOKEN}
      INTEGRA_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      # Para `POST /users/me/avatar/upload-url`. O endpoint é o que o CLIENTE alcança:
      # assinar é HMAC local, e este serviço nunca chama o storage.
      INTEGRA_STORAGE_ENDPOINT: ${INTEGRA_STORAGE_ENDPOINT:-http://localhost:9000}
      INTEGRA_STORAGE_BUCKET: ${INTEGRA_STORAGE_BUCKET:-integra}
      INTEGRA_STORAGE_ACCESS_KEY: ${MINIO_ROOT_USER:-integra}
      INTEGRA_STORAGE_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-integra-minio-dev}
    depends_on:
      postgres:
        condition: service_healthy
    labels:
      - traefik.enable=true
      - traefik.http.services.user.loadbalancer.server.port=8000
      # Um serviço, dois prefixos: `/universidades` alimenta o Select do cadastro
      # e é consultado sem autenticação, antes de existir conta.
      # Três prefixos: /universidades alimenta o cadastro sem autenticação, e
      # /busca é a caixa do cabeçalho. Um prefixo esquecido aqui vira 404 do
      # Traefik em texto puro — indistinguível de rota inexistente no serviço.
      - traefik.http.routers.user.rule=PathPrefix(`/users`) || PathPrefix(`/universidades`) || PathPrefix(`/busca`)
      - traefik.http.routers.user.entrypoints=web
      - traefik.http.routers.user-health.rule=Path(`/health/user`)
      - traefik.http.routers.user-health.entrypoints=web
      - traefik.http.routers.user-health.middlewares=user-health-path
      - traefik.http.routers.user-health.service=user
      - traefik.http.middlewares.user-health-path.replacepath.path=/health
    networks: [borda, interna]

  academic:
    build:
      context: ../services
      args:
        SERVICO: academic
    restart: unless-stopped
    environment:
      INTEGRA_AMBIENTE: ${INTEGRA_AMBIENTE:-local}
      INTEGRA_JWT_SECRET: ${INTEGRA_JWT_SECRET}
      # O mesmo segredo de serviço do auth: é ele que abre as rotas `/…/interno/…`
      # do user-service, de onde saem a lista de seguidas (o escopo do feed), a
      # instituição de quem publica e os resumos que montam os cards.
      INTEGRA_SERVICO_TOKEN: ${INTEGRA_SERVICO_TOKEN}
      INTEGRA_USER_SERVICE_URL: http://user:8000
      INTEGRA_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    depends_on:
      postgres:
        condition: service_healthy
      # `service_started` e não `service_healthy`: o academic-service **sobe** sem
      # o user-service. Só o escopo `geral` do feed depende dele — o `minha` sai
      # inteiramente dos claims do token. Exigir saúde aqui transformaria essa
      # independência deliberada em dependência de inicialização.
      user:
        condition: service_started
    labels:
      - traefik.enable=true
      - traefik.http.services.academic.loadbalancer.server.port=8000
      # Um prefixo só: todo caminho do contrato começa em `/academic`, inclusive
      # `/academic/universidades/{id}/posts` — que é de propósito, para não
      # competir com o `/universidades` do user-service no roteamento do gateway.
      - traefik.http.routers.academic.rule=PathPrefix(`/academic`)
      - traefik.http.routers.academic.entrypoints=web
      - traefik.http.routers.academic-health.rule=Path(`/health/academic`)
      - traefik.http.routers.academic-health.entrypoints=web
      - traefik.http.routers.academic-health.middlewares=academic-health-path
      - traefik.http.routers.academic-health.service=academic
      - traefik.http.middlewares.academic-health-path.replacepath.path=/health
    networks: [borda, interna]

  feed:
    build:
      context: ../services
      args:
        SERVICO: feed
    restart: unless-stopped
    environment:
      INTEGRA_AMBIENTE: ${INTEGRA_AMBIENTE:-local}
      INTEGRA_JWT_SECRET: ${INTEGRA_JWT_SECRET}
      INTEGRA_SERVICO_TOKEN: ${INTEGRA_SERVICO_TOKEN}
      INTEGRA_USER_SERVICE_URL: http://user:8000
      INTEGRA_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      # O endpoint que o CLIENTE alcança, e não `http://minio:9000`. Assinar é
      # computação local: o serviço nunca chama o storage, então o host que importa
      # é o que o celular resolve. Com o nome interno aqui, a URL assinada só
      # funcionaria de dentro do compose.
      INTEGRA_STORAGE_ENDPOINT: ${INTEGRA_STORAGE_ENDPOINT:-http://localhost:9000}
      INTEGRA_STORAGE_BUCKET: ${INTEGRA_STORAGE_BUCKET:-integra}
      INTEGRA_STORAGE_ACCESS_KEY: ${MINIO_ROOT_USER:-integra}
      INTEGRA_STORAGE_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-integra-minio-dev}
    depends_on:
      postgres:
        condition: service_healthy
      # `service_started`, como o academic: o feed SOBE sem o user-service. O que
      # degrada é o feed (503 honesto); o detalhe de um post e a aba de publicações
      # de um perfil continuam respondendo.
      user:
        condition: service_started
    labels:
      - traefik.enable=true
      - traefik.http.services.feed.loadbalancer.server.port=8000
      # Um prefixo só: todo caminho do contrato começa em `/feed`, inclusive
      # `/feed/usuarios/{id}/posts` — de propósito, para não competir com o
      # `/users` do user-service no roteamento do gateway.
      - traefik.http.routers.feed.rule=PathPrefix(`/feed`)
      - traefik.http.routers.feed.entrypoints=web
      - traefik.http.routers.feed-health.rule=Path(`/health/feed`)
      - traefik.http.routers.feed-health.entrypoints=web
      - traefik.http.routers.feed-health.middlewares=feed-health-path
      - traefik.http.routers.feed-health.service=feed
      - traefik.http.middlewares.feed-health-path.replacepath.path=/health
    networks: [borda, interna]

  jobs:
    build:
      context: ../services
      args:
        SERVICO: jobs
    restart: unless-stopped
    environment:
      INTEGRA_AMBIENTE: ${INTEGRA_AMBIENTE:-local}
      INTEGRA_JWT_SECRET: ${INTEGRA_JWT_SECRET}
      INTEGRA_SERVICO_TOKEN: ${INTEGRA_SERVICO_TOKEN}
      INTEGRA_USER_SERVICE_URL: http://user:8000
      INTEGRA_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      # Sem variáveis de storage: o jobs-service não emite URL de upload. Vaga é
      # texto, e um campo de imagem aqui seria escopo que nenhuma tela pede.
    depends_on:
      postgres:
        condition: service_healthy
      user:
        condition: service_started
    labels:
      - traefik.enable=true
      - traefik.http.services.jobs.loadbalancer.server.port=8000
      - traefik.http.routers.jobs.rule=PathPrefix(`/jobs`)
      - traefik.http.routers.jobs.entrypoints=web
      - traefik.http.routers.jobs-health.rule=Path(`/health/jobs`)
      - traefik.http.routers.jobs-health.entrypoints=web
      - traefik.http.routers.jobs-health.middlewares=jobs-health-path
      - traefik.http.routers.jobs-health.service=jobs
      - traefik.http.middlewares.jobs-health-path.replacepath.path=/health
    networks: [borda, interna]

  # Object Storage compatível com S3, para as URLs pré-assinadas de imagem. Trocar
  # para o Object Storage da Oracle é endpoint e credencial em `.env` — nenhuma linha
  # de código, porque a API é a mesma e o serviço só ASSINA.
  minio:
    # ponytail: `latest` é a única coisa honesta aqui, e é o único `latest` do
    # arquivo — Postgres, Traefik e a imagem dos serviços estão pinados.
    #
    # O MinIO versiona por `RELEASE.<data>`, e **nenhuma tag dessas foi verificada**:
    # o Docker Hub está inalcançável da máquina em que isto foi escrito (TLS
    # handshake timeout até num `docker pull hello-world`). Pinar uma data que eu não
    # consegui baixar seria pior que `latest`: daria aparência de reprodutibilidade a
    # um palpite, e quem subisse a stack descobriria a tag errada no primeiro
    # `compose up`.
    #
    # Upgrade: quem tiver rede para o Hub troca pelos dois `RELEASE.*` que de fato
    # baixarem, aqui e na linha do `mc` abaixo.
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-integra}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-integra-minio-dev}
    volumes:
      - ./data/minio:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      # 9000 NÃO fica em loopback, ao contrário do Postgres: a URL pré-assinada é
      # usada pelo celular, que não é a própria máquina. O console (9001) fica.
      - "9000:9000"
      - "127.0.0.1:9001:9001"
    networks: [interna]

  # Cria o bucket e o deixa legível sem assinatura. Roda uma vez e sai — `mc` não é
  # daemon, e deixar o contêiner de pé só para ele ter status "up" esconderia a
  # falha da criação do bucket atrás de um restart infinito.
  minio-init:
    # ponytail: idem — ver a nota da tag do `minio` acima.
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-integra}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-integra-minio-dev}
      BUCKET: ${INTEGRA_STORAGE_BUCKET:-integra}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD &&
      mc mb --ignore-existing local/$$BUCKET &&
      mc anonymous set download local/$$BUCKET
      "
    restart: "no"
    networks: [interna]

networks:
  # Só quem precisa receber tráfego de fora fica na rede de borda. O Postgres não
  # está nela, então o Traefik não consegue alcançá-lo nem por engano.
  borda:
  interna:
